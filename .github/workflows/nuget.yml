name: Build, Test, and Publish Packages

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

concurrency:
  group: publish-nuget-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  SOLUTION_PATH: MarsArmories.ImperialDate.slnx
  PROJECT_PATH: src/MarsArmories.ImperialDate/MarsArmories.ImperialDate.csproj
  # Optional MAJOR.MINOR override; otherwise use the project's PackageVersion.
  PACKAGE_MAJOR_MINOR: ""

jobs:
  build-test-pack:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Test package version resolution
        shell: pwsh
        run: ./.github/scripts/Test-PackageVersion.ps1

      - name: Restore dependencies
        run: dotnet restore "$SOLUTION_PATH"

      - name: Resolve package version
        id: package_version
        shell: pwsh
        env:
          PR_NUMBER: ${{ github.event.pull_request.number || 0 }}
        run: |
          $ErrorActionPreference = 'Stop'
          . ./.github/scripts/Get-PackageVersion.ps1
          $baseVersion = dotnet msbuild $env:PROJECT_PATH -nologo -getProperty:PackageVersion
          if ($LASTEXITCODE -ne 0) { throw 'Cannot read PackageVersion' }
          $packageId = dotnet msbuild $env:PROJECT_PATH -nologo -getProperty:PackageId
          if ($LASTEXITCODE -ne 0) { throw 'Cannot read PackageId' }
          $uri = "https://api.nuget.org/v3-flatcontainer/$($packageId.ToLowerInvariant())/index.json"
          try {
            $response = Invoke-RestMethod -Uri $uri -MaximumRetryCount 3 -TimeoutSec 30
            if ($null -eq $response.versions) { throw 'NuGet response has no versions array' }
            $versions = @($response.versions)
          } catch {
            if ($_.Exception.Response -and [int]$_.Exception.Response.StatusCode -eq 404) {
              $versions = @()
            } else { throw }
          }
          $version = Get-PackageVersion -BaseVersion $baseVersion -MajorMinor $env:PACKAGE_MAJOR_MINOR -PublishedVersions $versions -PullRequestNumber ([int]$env:PR_NUMBER) -RunNumber ([int]$env:GITHUB_RUN_NUMBER) -RunAttempt ([int]$env:GITHUB_RUN_ATTEMPT)
          "Resolved package version: $version"
          "value=$version" >> $env:GITHUB_OUTPUT

      - name: Build
        env:
          PACKAGE_VERSION: ${{ steps.package_version.outputs.value }}
        run: dotnet build "$SOLUTION_PATH" --configuration Release --no-restore -p:Version="$PACKAGE_VERSION" -p:PackageVersion="$PACKAGE_VERSION" -warnaserror

      - name: Test
        run: dotnet test --solution "$SOLUTION_PATH" --configuration Release --no-build

      - name: Pack
        env:
          PACKAGE_VERSION: ${{ steps.package_version.outputs.value }}
        run: dotnet pack "$PROJECT_PATH" --configuration Release --no-build --output .artifacts/packages -p:Version="$PACKAGE_VERSION" -p:PackageVersion="$PACKAGE_VERSION"

      - name: Retain packages
        uses: actions/upload-artifact@v7
        with:
          name: nuget-packages
          path: .artifacts/packages/*.nupkg
          if-no-files-found: error
          include-hidden-files: true

  publish:
    needs: build-test-pack
    if: ${{ github.actor != 'dependabot[bot]' && (github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository) }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      packages: write
    steps:
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - uses: actions/download-artifact@v8
        with:
          name: nuget-packages
          path: packages

      - name: Publish to NuGet.org
        if: github.event_name == 'push'
        env:
          NUGET_API_KEY: ${{ secrets.NUGET_API_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "$NUGET_API_KEY" ]]; then
            echo 'NuGet.org publishing skipped: NUGET_API_KEY is not configured.'
            exit 0
          fi
          shopt -s nullglob
          for package in packages/*.nupkg; do
            dotnet nuget push "$package" --api-key "$NUGET_API_KEY" --source https://api.nuget.org/v3/index.json --skip-duplicate
          done

      - name: Publish to GitHub Packages
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PACKAGE_OWNER: ${{ github.repository_owner }}
        shell: bash
        run: |
          set -euo pipefail
          for package in packages/*.nupkg; do
            dotnet nuget push "$package" --api-key "$GITHUB_TOKEN" --source "https://nuget.pkg.github.com/$PACKAGE_OWNER/index.json" --skip-duplicate
          done
