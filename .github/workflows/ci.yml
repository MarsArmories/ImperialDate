name: Continuous Integration
run-name: CI for ${{ github.ref_name }} by @${{ github.actor }}

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  DOTNET_NOLOGO: true
  SOLUTION_PATH: MarsArmories.ImperialDate.slnx
  PROJECT_PATH: src/MarsArmories.ImperialDate/MarsArmories.ImperialDate.csproj

jobs:
  build-test:
    name: Build and test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Define pull request prerelease version
        if: github.event_name == 'pull_request'
        id: prerelease
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          short_sha="${GITHUB_SHA::7}"
          suffix="pr.${PR_NUMBER}.${short_sha}"
          echo "suffix=$suffix" >> "$GITHUB_OUTPUT"
          echo "Packing prerelease version suffix: $suffix"

      - name: Restore
        run: |
          echo "::group::Restore"
          dotnet restore "$SOLUTION_PATH"
          echo "::endgroup::"

      - name: Build
        run: |
          echo "::group::Build"
          dotnet build "$SOLUTION_PATH" --configuration Release --no-restore -p:VersionSuffix="${{ steps.prerelease.outputs.suffix }}" -warnaserror
          echo "::endgroup::"

      - name: Test with coverage
        run: |
          echo "::group::Test with coverage"
          mkdir -p .artifacts/test-results
          dotnet test --solution "$SOLUTION_PATH" --configuration Release --no-build --coverage --coverage-output .artifacts/test-results/coverage.cobertura.xml --coverage-output-format cobertura
          echo "::endgroup::"

      - name: Pack pull request prerelease artifacts
        if: github.event_name == 'pull_request'
        run: |
          echo "::group::Pack pull request prerelease artifacts"
          dotnet pack "$PROJECT_PATH" --configuration Release --no-build --output .artifacts/package/prerelease --version-suffix "${{ steps.prerelease.outputs.suffix }}"
          echo "::endgroup::"

      - name: Upload pull request prerelease artifacts
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v7
        with:
          name: prerelease-packages-pr-${{ github.event.pull_request.number }}
          retention-days: 7
          path: |
            .artifacts/package/prerelease/*.nupkg
            .artifacts/package/prerelease/*.snupkg

      - name: Upload coverage
        uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: TestResults/.artifacts/test-results/coverage.cobertura.xml

      - name: Build summary
        if: always()
        run: |
          {
            echo "## ImperialDate CI"
            echo
            echo "| Check | Result |"
            echo "| --- | --- |"
            echo "| Restore | complete |"
            echo "| Build | complete |"
            echo "| Tests | complete |"
            echo "| Coverage | Cobertura files uploaded as artifact \`coverage\` |"
            if [ "${{ github.event_name }}" = "pull_request" ]; then
              echo "| PR packages | prerelease artifacts uploaded without registry publication |"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
